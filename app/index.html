<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VLC Cast</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#10131a;color:#f7f8fc;font:24px Arial,sans-serif;overflow:auto}
body{padding:3vh 4vw}
h1{font-size:38px;margin:0 0 12px;color:#70b7ff}
p{font-size:19px;color:#c8d2e2}
label{display:block;margin:18px 0 8px}
input,button{font:inherit;border-radius:10px;border:3px solid #66758a;padding:15px 18px;min-height:60px}
input{width:100%;background:#202735;color:#fff}
button{background:#263e5c;color:#fff;margin:6px 5px 6px 0;min-width:150px;cursor:pointer}
button:focus,input:focus,.focused{outline:5px solid #ffdc4d!important;outline-offset:3px;border-color:#ffdc4d!important}
#status{padding:12px;background:#202735;border-radius:8px;min-height:48px;overflow-wrap:anywhere}
.small{font-size:16px;color:#aab7c9}
</style>
</head>
<body>
<h1>VLC Cast</h1>
<p>Введите прямую сетевую ссылку на видео или поток. Выберите поле стрелками пульта, нажмите OK для ввода.</p>
<label for="url">URL потока</label>
<input id="url" type="text" value="" placeholder="https://... или http://...">
<div>
<button id="play">▶ Воспроизвести</button>
<button id="pause">⏯ Пауза / продолжить</button>
<button id="stop">■ Стоп</button>
</div>
<div>
<button id="load">↓ Загрузить URL с ПК</button>
<button id="refresh">↻ Проверить сервер</button>
</div>
<p id="status" role="status">IP компьютера: 192.168.1.119:8765</p>
<p class="small">Стрелки — выбор элемента. OK/Enter — действие. Back — предыдущий экран. Если загрузка URL с ПК не работает, введите ссылку вручную.</p>
<script>
(function(){
  'use strict';
  var PC_IP = '192.168.1.119';
  var BASE = 'http://' + PC_IP + ':8765';
  var url = document.getElementById('url');
  var status = document.getElementById('status');
  var focusables = Array.prototype.slice.call(document.querySelectorAll('input,button'));
  var current = 0;
  function say(t){status.textContent=t;}
  function focusAt(i){current=(i+focusables.length)%focusables.length;focusables[current].focus();}
  // Explicit TV remote navigation, even when the browser doesn't move focus by itself.
  document.addEventListener('keydown',function(e){
    var k=e.keyCode||e.which;
    if(k===37||k===38||k===39||k===40){
      // Let arrows edit/move caret when the URL field itself is focused.
      if(document.activeElement===url && (k===37||k===39)) return;
      e.preventDefault();
      if(k===38||k===37) focusAt(current-1); else focusAt(current+1);
    } else if(k===13){
      // Native Enter on focused controls is normally enough; don't double-trigger.
      if(document.activeElement===document.body){e.preventDefault();focusAt(current);}
    } else if(k===10009 || k===27){
      // Samsung RETURN: leave handling to Tizen where possible.
      try{if(window.tizen&&tizen.application)tizen.application.getCurrentApplication().hide();}catch(_){}
    } else if(k===415){e.preventDefault();play();}
      else if(k===19){e.preventDefault();pause();}
      else if(k===413){e.preventDefault();stop();}
  });
  focusables.forEach(function(el,i){el.addEventListener('focus',function(){current=i;});});
  function avplay(){return window.webapis&&webapis.avplay?webapis.avplay:null;}
  function play(){
    var a=avplay(), u=url.value.trim();
    if(!u){say('Сначала введите URL потока.');url.focus();return;}
    if(!/^https?:\/\//i.test(u) && !/^rtsp:\/\//i.test(u)){say('URL должен начинаться с http://, https:// или rtsp://');return;}
    if(!a){say('На этой странице не найден webapis.avplay. Возможно, модуль открыт в браузере TizenBrew без доступа к AVPlay.');return;}
    try{a.open(u);a.setDisplayRect(0,0,1920,1080);a.prepareAsync(function(){try{a.play();say('Воспроизведение запущено.');}catch(e){say('Ошибка play: '+e.message);}},function(e){say('Ошибка подготовки потока: '+(e.message||e));});}
    catch(e){say('Ошибка AVPlay: '+e.message);}
  }
  function pause(){var a=avplay();if(!a){say('AVPlay недоступен на этой странице.');return;}try{if(a.getState()==='PLAYING')a.pause();else a.play();say('Команда паузы/продолжения отправлена.');}catch(e){say('Ошибка паузы: '+e.message);}}
  function stop(){var a=avplay();if(!a){say('AVPlay недоступен на этой странице.');return;}try{a.stop();say('Воспроизведение остановлено.');}catch(e){say('Ошибка остановки: '+e.message);}}
  async function loadUrl(){
    try{say('Подключаюсь к ПК '+BASE+' …');var r=await fetch(BASE+'/api/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);var d=await r.json();if(!d.url)throw Error('На ПК пока не задан URL');url.value=d.url;say('URL загружен с ПК. Нажмите «Воспроизвести».');}
    catch(e){say('Не удалось получить URL с ПК: '+e.message+'. Возможна блокировка HTTP-запроса из HTTPS-страницы или проблема сети. Введите URL вручную.');}
  }
  async function health(){try{var r=await fetch(BASE+'/api/health',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);var d=await r.json();say('Сервер ПК доступен: '+BASE+' ('+d.status+').');}catch(e){say('Нет связи с '+BASE+'. Проверьте IP, запуск сервера и брандмауэр Windows. '+e.message);}}
  document.getElementById('play').addEventListener('click',play);
  document.getElementById('pause').addEventListener('click',pause);
  document.getElementById('stop').addEventListener('click',stop);
  document.getElementById('load').addEventListener('click',loadUrl);
  document.getElementById('refresh').addEventListener('click',health);
  focusAt(0);
})();
</script>
</body></html>
